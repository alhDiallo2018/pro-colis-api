name: procolis-observability

# Stack autonome rattachee au reseau du Compose de production. Aucun service,
# hormis Grafana sur loopback, ne publie de port sur l'hote.
services:
  loki:
    image: grafana/loki:3.7.2
    container_name: sendprocolis-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks: [procolis]
    mem_limit: 512m
    cpus: 0.75
    logging: &rotated-logs
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: sendprocolis-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      APP_RELEASE: ${APP_RELEASE:-unknown}
      FARO_ALLOWED_ORIGIN: ${FARO_ALLOWED_ORIGIN:?URL publique requise, ex. https://sendprocolis.com}
      FARO_SOURCEMAP_PREFIX: ${FARO_SOURCEMAP_PREFIX:?Prefixe des assets frontend requis}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./sourcemaps:/var/lib/alloy/sourcemaps:ro
      # Le socket n'est jamais expose hors de ce conteneur. Alloy en a besoin
      # pour suivre les logs via l'API Docker sans lire les fichiers internes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    networks: [procolis]
    mem_limit: 256m
    cpus: 0.50
    logging: *rotated-logs

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: sendprocolis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    depends_on: [alertmanager, blackbox-exporter, postgres-exporter, node-exporter]
    networks: [procolis]
    mem_limit: 512m
    cpus: 0.75
    logging: *rotated-logs

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: sendprocolis-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [brevo_smtp_key]
    networks: [procolis]
    mem_limit: 128m
    cpus: 0.25
    logging: *rotated-logs

  grafana:
    image: grafana/grafana:13.1.0
    container_name: sendprocolis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:13000
    ports:
      # Interface de secours accessible uniquement depuis le VPS ou un tunnel SSH.
      - "127.0.0.1:13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    depends_on: [loki, prometheus]
    networks: [procolis]
    mem_limit: 384m
    cpus: 0.50
    logging: *rotated-logs

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: sendprocolis-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:?URI PostgreSQL sans identifiants requise}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-procolis_monitor}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_monitor_password
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
    secrets: [postgres_monitor_password]
    networks: [procolis]
    mem_limit: 128m
    cpus: 0.25
    logging: *rotated-logs

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: sendprocolis-blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [procolis]
    mem_limit: 96m
    cpus: 0.20
    logging: *rotated-logs

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: sendprocolis-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks: [procolis]
    mem_limit: 96m
    cpus: 0.20
    logging: *rotated-logs

networks:
  procolis:
    external: true
    name: ${PROCOLIS_DOCKER_NETWORK:-procolis-observability-shared}

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  metrics_token:
    file: ${METRICS_TOKEN_FILE:-./secrets/metrics_token}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password}
  brevo_smtp_key:
    file: ${BREVO_SMTP_KEY_FILE:-./secrets/brevo_smtp_key}
  postgres_monitor_password:
    file: ${POSTGRES_MONITOR_PASSWORD_FILE:-./secrets/postgres_monitor_password}
