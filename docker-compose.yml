services:
  api:
    build: .
    container_name: procolis-node-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://procolis:procolis@host.docker.internal:5432/procolis?schema=public
      PORT: 8080
    ports:
      - "${API_PORT:-18081}:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks: [default, observability]
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

networks:
  observability:
    name: ${PROCOLIS_DOCKER_NETWORK:-procolis-observability-shared}