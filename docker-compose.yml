services:
  api:
    build: .
    container_name: procolis-node-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://procolis:procolis@postgres:5432/procolis?schema=public
      PORT: 8080
    ports:
      - "${API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks: [default, observability]
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: procolis-node-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procolis
      POSTGRES_USER: procolis
      POSTGRES_PASSWORD: procolis
    # Expose la base a l'hote pour que la suite de tests et le CLI Prisma
    # puissent l'atteindre : le hostname `postgres` n'existe que dans le
    # reseau Docker. Port decale, 5432 etant deja pris sur l'hote.
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [default, observability]
    # Journaliser les erreurs sans recopier les requetes ni leurs parametres,
    # qui peuvent contenir des donnees personnelles ou des secrets.
    command:
      - postgres
      - -c
      - log_min_messages=warning
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procolis -d procolis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  # Ce reseau nomme permet a une stack Compose separee de joindre l'API et
  # PostgreSQL sans publier Loki, Prometheus ou les exporters sur l'hote.
  observability:
    name: ${PROCOLIS_DOCKER_NETWORK:-procolis-observability-shared}
